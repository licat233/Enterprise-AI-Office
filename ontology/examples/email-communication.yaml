schema_version: "0.3.0"
kind: enterprise-ontology-example

metadata:
  id: email-communication
  version: "0.2.1"
  status: design-example
  normative: false
  runtime_enforcement: false
  source_contract: docs/ONTOLOGY.md
  source_contract_version: "0.3.0"
  purpose: >-
    Describe the Enterprise AI Office v2 governed email workflow using the
    completed System Design and Installation Design contracts. This fixture is
    reviewable design evidence; it is not a live authorization or deployment.
  policy_note: >-
    HumanActor identity, mailbox authorization, Draft/Approval persistence,
    provider send binding, and reconciliation are implemented by the v2
    installation blueprint. This YAML remains non-executable and contains only
    synthetic/provider-agnostic identifiers.

domain: email-communication

systems:
  enterprise-ai-office:
    role: governance-owner
    binding_status: installation-designed
  email-provider:
    role: system-of-record
    binding_status: provider-selected-reference
    note: >-
      Tencent Enterprise Mail is the reference provider. A real provider
      connection still requires an explicitly authorized validation/deployment
      target and protected credentials.

objects:
  Mailbox:
    description: A provider mailbox explicitly selected by company configuration.
    identity:
      primary_key: mailbox_id
      authority:
        class: source-backed
        system: email-provider
    visibility:
      default: deny
      read_requirements:
        - entitlement: email.read
    properties:
      mailbox_id:
        type: string
        required: true
        mutable: false
        authority: {class: source-backed, system: email-provider}
      address:
        type: string
        required: true
        mutable: false
        sensitivity: business-contact
        authority: {class: source-backed, system: email-provider}
      provider:
        type: string
        required: true
        mutable: false
        authority: {class: source-backed, system: email-provider}

  EmailMessage:
    description: Provider-backed inbound/outbound email context read through a mailbox-scoped governed operation.
    identity:
      primary_key: message_id
      authority:
        class: source-backed
        system: email-provider
    visibility:
      default: deny
      read_requirements:
        - entitlement: email.read
    properties:
      message_id:
        type: string
        required: true
        mutable: false
        authority: {class: source-backed, system: email-provider}
      mailbox_id:
        type: string
        required: true
        mutable: false
        authority: {class: source-backed, system: email-provider}
      from_address:
        type: string
        required: true
        mutable: false
        sensitivity: communication-data
        authority: {class: source-backed, system: email-provider}
      to_addresses:
        type: array
        required: true
        mutable: false
        sensitivity: communication-data
        authority: {class: source-backed, system: email-provider}
      cc_addresses:
        type: array
        required: false
        mutable: false
        sensitivity: communication-data
        authority: {class: source-backed, system: email-provider}
      subject:
        type: string
        required: false
        mutable: false
        sensitivity: communication-data
        authority: {class: source-backed, system: email-provider}
      body:
        type: string
        required: false
        mutable: false
        sensitivity: communication-data
        authority: {class: source-backed, system: email-provider}
      sent_at:
        type: datetime
        required: false
        mutable: false
        authority: {class: source-backed, system: email-provider}

  DraftReply:
    description: >-
      An EAO-owned reviewable outbound reply. Each material edit creates an
      immutable revision. Runtime persistence uses (draft_id, revision) while
      draft_id remains the logical Object identity in this design fixture.
    identity:
      primary_key: draft_id
      authority:
        class: ontology-owned
        system: enterprise-ai-office
    visibility:
      default: deny
      read_requirements:
        - entitlement: email.draft
    properties:
      draft_id:
        type: string
        required: true
        mutable: false
        authority: {class: ontology-owned, system: enterprise-ai-office}
      source_message_id:
        type: string
        required: true
        mutable: false
        authority: {class: ontology-owned, system: enterprise-ai-office}
      sender_mailbox_id:
        type: string
        required: true
        mutable: false
        authority: {class: ontology-owned, system: enterprise-ai-office}
      to_addresses:
        type: array
        required: true
        mutable: false
        sensitivity: outbound-communication
        authority: {class: ontology-owned, system: enterprise-ai-office}
      cc_addresses:
        type: array
        required: false
        mutable: false
        sensitivity: outbound-communication
        authority: {class: ontology-owned, system: enterprise-ai-office}
      subject:
        type: string
        required: true
        mutable: false
        sensitivity: outbound-communication
        authority: {class: ontology-owned, system: enterprise-ai-office}
      body:
        type: string
        required: true
        mutable: false
        sensitivity: outbound-communication
        authority: {class: ontology-owned, system: enterprise-ai-office}
      revision:
        type: integer
        required: true
        mutable: false
        authority: {class: ontology-owned, system: enterprise-ai-office}
      content_hash:
        type: string
        required: true
        mutable: false
        authority:
          class: derived
          inputs:
            - DraftReply.sender_mailbox_id
            - DraftReply.to_addresses
            - DraftReply.cc_addresses
            - DraftReply.subject
            - DraftReply.body
            - DraftReply.source_message_id
            - DraftReply.revision
          rule: canonical_sha256(material_outbound_fields)
      created_by_actor_id:
        type: string
        required: true
        mutable: false
        authority: {class: ontology-owned, system: enterprise-ai-office}
      created_at:
        type: datetime
        required: true
        mutable: false
        authority: {class: ontology-owned, system: enterprise-ai-office}

  SendApproval:
    description: >-
      Immutable trusted-human approval bound to one exact DraftReply
      revision/hash. The Governance service validates this evidence during send;
      the sender does not need to also possess email.approve.
    identity:
      primary_key: approval_id
      authority:
        class: ontology-owned
        system: enterprise-ai-office
    visibility:
      default: deny
      read_requirements:
        - entitlement: email.send
    properties:
      approval_id:
        type: string
        required: true
        mutable: false
        authority: {class: ontology-owned, system: enterprise-ai-office}
      draft_id:
        type: string
        required: true
        mutable: false
        authority: {class: ontology-owned, system: enterprise-ai-office}
      draft_revision:
        type: integer
        required: true
        mutable: false
        authority: {class: ontology-owned, system: enterprise-ai-office}
      draft_content_hash:
        type: string
        required: true
        mutable: false
        authority: {class: ontology-owned, system: enterprise-ai-office}
      approved_by_actor_id:
        type: string
        required: true
        mutable: false
        authority: {class: ontology-owned, system: enterprise-ai-office}
      approved_at:
        type: datetime
        required: true
        mutable: false
        authority: {class: ontology-owned, system: enterprise-ai-office}

relations:
  mailbox_contains_message:
    from: Mailbox
    to: EmailMessage
    predicate: contains
    cardinality: one-to-many
    authority: {class: source-backed, system: email-provider}
    read_requirements:
      - entitlement: email.read
    binding:
      source_property: Mailbox.mailbox_id
      target_property: EmailMessage.mailbox_id

  draft_replies_to_message:
    from: DraftReply
    to: EmailMessage
    predicate: replies_to
    cardinality: many-to-one
    authority: {class: ontology-owned, system: enterprise-ai-office}
    read_requirements:
      - entitlement: email.draft
      - entitlement: email.read

  approval_authorizes_draft:
    from: SendApproval
    to: DraftReply
    predicate: authorizes
    cardinality: many-to-one
    authority: {class: ontology-owned, system: enterprise-ai-office}
    read_requirements:
      - entitlement: email.send
      - entitlement: email.draft

read_operations:
  search_email:
    target: EmailMessage
    actor_requirements:
      trusted_human_identity: required
      entitlements: [email.read]
    filters:
      - EmailMessage.mailbox_id
      - EmailMessage.from_address
      - EmailMessage.subject
      - EmailMessage.sent_at
    projections:
      - EmailMessage.message_id
      - EmailMessage.from_address
      - EmailMessage.to_addresses
      - EmailMessage.subject
      - EmailMessage.sent_at
    result_visibility: object-visibility-policy
    tool_binding:
      status: installation-designed
      operation: enterprise-ai-office.search_email

  get_email:
    target: EmailMessage
    actor_requirements:
      trusted_human_identity: required
      entitlements: [email.read]
    projections:
      - EmailMessage.message_id
      - EmailMessage.mailbox_id
      - EmailMessage.from_address
      - EmailMessage.to_addresses
      - EmailMessage.cc_addresses
      - EmailMessage.subject
      - EmailMessage.body
      - EmailMessage.sent_at
    result_visibility: object-visibility-policy
    tool_binding:
      status: installation-designed
      operation: enterprise-ai-office.get_email

actions:
  prepare_reply_draft:
    description: Create an immutable EAO-owned DraftReply revision without provider-side send effect.
    target: EmailMessage
    parameters:
      source_message_id: {type: string, required: true}
      sender_mailbox_id: {type: string, required: true}
      to_addresses: {type: array, required: true}
      cc_addresses: {type: array, required: false}
      subject: {type: string, required: true}
      body: {type: string, required: true}
    actor_requirements:
      trusted_human_identity: required
      profile_capability: email.draft
      entitlements: [email.read, email.draft]
    preconditions:
      - id: source-message-exists
        rule: EmailMessage(source_message_id) exists
        on_fail: {decision: deny, code: SOURCE_MESSAGE_NOT_FOUND}
      - id: actor-resolved
        rule: actor.actor_id is trusted and resolved
        on_fail: {decision: blocked, code: ACTOR_UNRESOLVED}
    authority: {class: ontology-owned, system: enterprise-ai-office}
    tool_binding:
      status: installation-designed
      operation: enterprise-ai-office.prepare_reply_draft
    effects:
      - type: ontology-owned-mutation
        object: DraftReply
        description: Create one immutable revision and server-computed content hash.
      - type: audit-event
        description: Record actor, source message, draft revision, and hash.
    failure_behavior:
      idempotency_key: source_message_id + sender_mailbox_id + actor.actor_id
      duplicate_same_request: return-existing-or-create-explicit-new-revision
    audit: {enabled: true}

  approve_reply_draft:
    description: Record explicit trusted-human approval for one exact DraftReply revision/hash.
    target: DraftReply
    parameters:
      draft_id: {type: string, required: true}
      expected_revision: {type: integer, required: true}
      expected_content_hash: {type: string, required: true}
    actor_requirements:
      trusted_human_identity: required
      profile_capability: email.approve
      entitlements: [email.draft, email.approve]
    preconditions:
      - id: revision-match
        rule: DraftReply.revision == expected_revision
        on_fail: {decision: deny, code: DRAFT_REVISION_MISMATCH}
      - id: hash-match
        rule: DraftReply.content_hash == expected_content_hash
        on_fail: {decision: deny, code: DRAFT_HASH_MISMATCH}
      - id: actor-resolved
        rule: actor.actor_id is trusted and resolved
        on_fail: {decision: blocked, code: ACTOR_UNRESOLVED}
    approval:
      mode: explicit-human-approval
      requirement: The authenticated HumanActor explicitly approves the exact persisted outbound state.
      binding:
        object_id: DraftReply.draft_id
        revision: DraftReply.revision
        content_hash: DraftReply.content_hash
      on_missing: {decision: deny, code: MISSING_HUMAN_APPROVAL}
    authority: {class: ontology-owned, system: enterprise-ai-office}
    tool_binding:
      status: installation-designed
      operation: enterprise-ai-office.approve_reply_draft
    effects:
      - type: ontology-owned-mutation
        object: SendApproval
        description: Create immutable approval evidence for the exact draft revision/hash.
      - type: audit-event
        description: Record HumanActor, approved revision/hash, and governance contract version.
    failure_behavior:
      idempotency_key: draft_id + expected_revision + expected_content_hash + actor.actor_id
      duplicate_same_approval: return-existing-approval
    audit: {enabled: true}

  send_approved_reply:
    description: Execute one governed logical send for the exact DraftReply revision/hash covered by a valid SendApproval.
    target: DraftReply
    parameters:
      draft_id: {type: string, required: true}
      expected_revision: {type: integer, required: true}
      expected_content_hash: {type: string, required: true}
    actor_requirements:
      trusted_human_identity: required
      profile_capability: email.send
      entitlements: [email.read, email.draft, email.send]
    preconditions:
      - id: source-message-exists
        rule: EmailMessage(DraftReply.source_message_id) exists
        on_fail: {decision: deny, code: SOURCE_MESSAGE_NOT_FOUND}
      - id: current-revision-match
        rule: DraftReply.revision == expected_revision
        on_fail: {decision: deny, code: DRAFT_REVISION_MISMATCH}
      - id: current-hash-match
        rule: DraftReply.content_hash == expected_content_hash
        on_fail: {decision: deny, code: DRAFT_HASH_MISMATCH}
      - id: valid-bound-approval-exists
        rule: >-
          related SendApproval exists where
          SendApproval.draft_id == DraftReply.draft_id and
          SendApproval.draft_revision == DraftReply.revision and
          SendApproval.draft_content_hash == DraftReply.content_hash
        on_fail: {decision: deny, code: VALID_APPROVAL_NOT_FOUND}
      - id: actor-resolved
        rule: actor.actor_id is trusted and resolved
        on_fail: {decision: blocked, code: ACTOR_UNRESOLVED}
    approval:
      mode: role-based-approval
      requirement: >-
        A valid SendApproval for the exact current revision/hash must exist
        before logical-send claim. The approver and sender may be different
        authorized HumanActors.
      binding:
        relation: approval_authorizes_draft
        revision: DraftReply.revision
        content_hash: DraftReply.content_hash
      on_missing: {decision: deny, code: VALID_APPROVAL_NOT_FOUND}
    authority: {class: source-backed, system: email-provider}
    tool_binding:
      status: installation-designed
      operation: enterprise-ai-office.send_approved_reply
      note: Governance owns authorization and provider adapter invocation; no generic SMTP primitive is exposed.
    effects:
      - type: external-source-mutation
        system: email-provider
        description: Submit the immutable approved payload through the narrow provider adapter.
      - type: audit-event
        description: Persist logical-send, provider-attempt, normalized outcome, and reconciliation evidence.
    failure_behavior:
      stale_approval: deny
      ambiguous_provider_outcome: reconciliation-required
      blind_retry_after_ambiguous_outcome: forbidden
      retry: only-inside-same-logical-send-after-confirmed-not-sent
    audit:
      enabled: true
      record:
        - human_actor_id
        - profile_actor_id
        - approval_reference
        - draft_revision
        - draft_content_hash
        - logical_send_id
        - provider_result_reference
        - decision
        - reason_code

operation_surface:
  reads:
    - search_email
    - get_email
  actions:
    - prepare_reply_draft
    - approve_reply_draft
    - send_approved_reply

installation_contracts:
  identity_authorization: docs/V2-IDENTITY-AUTHORIZATION-INSTALLATION.md
  governance_runtime: docs/V2-GOVERNANCE-RUNTIME.md
  send_reconciliation: docs/V2-SEND-RECONCILIATION.md
  recovery_clean_host: docs/V2-RECOVERY-CLEAN-HOST.md

non_goals:
  - crm-model
  - calendar-model
  - email-thread-shadow-database
  - generic-smtp-tool
  - bulk-or-campaign-send
  - llm-inferred-approval
  - automatic-retry-after-ambiguous-send
