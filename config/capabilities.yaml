schema_version: 1

# This registry tells a deployment agent what must be implemented and validated
# when a company enables a capability. It is a capability library, not a list of
# things every company should install.

readiness_levels:
  core-ready:
    requires:
      - core.employee_path
  configured-ready:
    requires:
      - core.employee_path
      - all_company_enabled_capabilities
  production-ready:
    requires:
      - core.employee_path
      - all_company_enabled_capabilities
      - production.backup_restore
      - production.startup_recovery
      - production.security_access_review
      - production.operations_health

capabilities:
  core.employee_path:
    kind: core
    always_enabled: true
    implementation:
      - DEPLOY.md
      - docs/DEPLOYMENT.md
      - infrastructure/weknora/README.md
      - infrastructure/weknora/PROVISIONING.md
      - infrastructure/hermes/README.md
      - infrastructure/open-webui/README.md
      - infrastructure/open-webui/PROVISIONING.md
    acceptance:
      document: docs/ACCEPTANCE-TESTS.md
      section: Part A — Core Ready
    records:
      - component versions
      - WeKnora runtime tenant and logical-to-runtime Knowledge Base mappings
      - WeKnora Profile retrieval-key IDs/names and scope metadata, never token values
      - knowledge bases
      - enabled profiles
      - employee groups and assistant mappings
      - network exposure
      - memory state
      - core acceptance result

  specialist_profiles:
    kind: conditional
    enabled_when: profiles contains any employee-facing Profile beyond general
    implementation:
      - docs/PROFILE-STANDARD.md
      - profiles/README.md
      - infrastructure/hermes/specialist.config.example.yaml
      - infrastructure/hermes/specialist.env.example
    acceptance:
      document: docs/ACCEPTANCE-TESTS.md
      section: Specialist Profile RBAC
    records:
      - purpose
      - employee groups
      - knowledge scope
      - tool scope
      - model policy
      - memory policy
      - API credential boundary

  hermes_webui:
    kind: conditional
    enabled_when: capabilities.hermes_webui.enabled == true
    implementation:
      - infrastructure/hermes-webui/README.md
    upstream: nesquena/hermes-webui
    acceptance:
      document: docs/ACCEPTANCE-TESTS.md
      section: Hermes administrative Web UI
    records:
      - exact upstream commit/version
      - bind/access method
      - authentication method
      - HERMES_HOME/state path
      - health result

  coding_delegation:
    kind: conditional
    enabled_when: capabilities.coding_delegation.enabled == true
    implementation:
      - infrastructure/coding-agents/README.md
      - infrastructure/coding-agents/technical-profile.config.example.yaml
      - profiles/engineering/SOUL.md
    acceptance:
      document: docs/ACCEPTANCE-TESTS.md
      sections:
        - Engineering / privileged technical Profile
        - Codex delegation
        - Claude Code delegation
    records:
      - allowed Profiles
      - allowed repositories/workspaces
      - enabled coding backends
      - CLI authentication boundary
      - delegation test results

  kanban:
    kind: conditional
    enabled_when: capabilities.kanban.enabled == true
    implementation:
      - infrastructure/hermes/features/README.md
    upstream_feature: Hermes Kanban
    acceptance:
      document: docs/ACCEPTANCE-TESTS.md
      section: Kanban
    records:
      - enabled boards
      - owner/orchestrator Profiles
      - workspace policy
      - dispatcher state
      - acceptance result

  cron:
    kind: conditional
    enabled_when: capabilities.cron.enabled == true
    implementation:
      - infrastructure/hermes/features/README.md
    upstream_feature: Hermes Cron
    acceptance:
      document: docs/ACCEPTANCE-TESTS.md
      section: Cron
    records:
      - owner Profiles
      - model/provider policy
      - delivery targets
      - business-critical jobs
      - acceptance result

  messaging:
    kind: conditional
    enabled_when: capabilities.messaging.enabled == true
    implementation:
      - infrastructure/hermes/features/README.md
      - infrastructure/hermes/features/MESSAGING.md
    upstream_feature: Hermes Gateway messaging
    required_company_values:
      - selected platform
      - enterprise/bot credentials
      - authorized users/chats or identity policy
      - Profile routing
    acceptance:
      document: docs/ACCEPTANCE-TESTS.md
      section: Messaging
    records:
      - platform
      - authorization method
      - Profile routing
      - delivery policy
      - acceptance result

  email_tencent_exmail:
    kind: conditional
    enabled_when: capabilities.email.enabled == true and capabilities.email.provider == tencent-exmail
    implementation:
      - docs/V2-SCOPE.md
      - docs/V2-EMAIL-DESIGN.md
      - docs/V2-DESIGN-REVIEW.md
      - docs/V2-IMPLEMENTATION-PLAN.md
      - docs/V2-INSTALLATION-ARCHITECTURE.md
      - docs/V2-CONFIG-PROTECTED-INPUTS.md
      - docs/V2-STAGE-CONTRACTS.md
      - docs/V2-IDENTITY-AUTHORIZATION-INSTALLATION.md
      - docs/V2-GOVERNANCE-RUNTIME.md
      - docs/V2-SEND-RECONCILIATION.md
      - docs/V2-RECOVERY-CLEAN-HOST.md
      - docs/ONTOLOGY.md
      - ontology/examples/email-communication.yaml
      - config/company.private.example.yaml
      - infrastructure/open-webui/V2-COMMUNICATION-PROVISIONING.md
      - infrastructure/open-webui/V2-APPROVAL-ACTION.md
      - infrastructure/open-webui/v2_approve_draft_action.py
      - infrastructure/email/governance/README.md
      - infrastructure/email/governance/schema.sql
      - infrastructure/email/governance/migrations/002_send_reconciliation.sql
      - infrastructure/email/governance/backup_state.py
      - infrastructure/email/governance/restore_state.py
      - infrastructure/email/governance/test_schema.py
      - infrastructure/email/governance/test_send_reconciliation.py
      - infrastructure/email/governance/test_recovery.py
      - infrastructure/email/tencent-exmail/README.md
      - infrastructure/email/tencent-exmail/imap_readonly_mcp.py
      - infrastructure/email/tencent-exmail/imap.env.example
      - infrastructure/email/tencent-exmail/test_imap_readonly.py
      - infrastructure/email/tencent-exmail/smtp_send_adapter.py
      - infrastructure/email/tencent-exmail/smtp.env.example
      - infrastructure/email/tencent-exmail/test_smtp_send_adapter.py
      - scripts/backup.sh
      - scripts/restore.sh
    stage_closure:
      contract: docs/V2-STAGE-CONTRACTS.md
      mandatory_when_enabled:
        - stage_0_v1_baseline
        - stage_1_read_only_email
        - stage_2_draft_preparation
        - stage_3_human_approval
        - stage_4_governed_send
      conditional:
        stage_5_simple_followup: capabilities.cron.enabled == true and company defines communication follow-up
        stage_6_messaging_surface: capabilities.messaging.enabled == true
      mandatory_exit_milestone: GOVERNED EMAIL LOOP PASS
    required_company_values:
      - communication Profile ID and intended employee groups
      - selected mailbox logical ID and address
      - mailbox business purpose/owner context
      - explicit principal + mailbox + operation grants
      - deterministic logical group to Open WebUI runtime group mapping
      - Open WebUI trusted HumanActor source/actor namespace
      - protected Open WebUI to Governance forwarder credential reference
      - private Governance service URL/runtime route
      - allowed mailbox folders/read scope
      - selected provider endpoint mode when default is not accepted
      - outbound human-approval policy must remain enabled
      - controlled initial recipient/test scope
      - attachment policy
      - governance state/log path or accepted derived default
      - symbolic mailbox client-credential reference
      - protected operator/evidence path for reconciliation
      - Governance backup/retention policy or accepted company default when production-ready is requested
    required_secret_classes:
      - specialist-profile-credential
      - open-webui-governance-forwarder-credential
      - email-mailbox-client-credential
    protected_input_contract:
      document: docs/V2-CONFIG-PROTECTED-INPUTS.md
      private_overlay_example: config/company.private.example.yaml
      missing_required_input: "BLOCKED — REQUIRED INPUT: <specific input>"
      config_conflict: "BLOCKED — CONFIG CONFLICT: <specific conflict>"
      security_violation: "FAIL — SECURITY CONTRACT VIOLATION: <invariant>"
    identity_authorization_contract:
      document: docs/V2-IDENTITY-AUTHORIZATION-INSTALLATION.md
      open_webui_provisioning: infrastructure/open-webui/V2-COMMUNICATION-PROVISIONING.md
      human_actor_namespace: open-webui
      no_grant_behavior: DENY
    governance_runtime_contract:
      document: docs/V2-GOVERNANCE-RUNTIME.md
      sqlite_schema: infrastructure/email/governance/schema.sql
      offline_test: infrastructure/email/governance/test_schema.py
      approval_action_contract: infrastructure/open-webui/V2-APPROVAL-ACTION.md
      approval_action_template: infrastructure/open-webui/v2_approve_draft_action.py
      draft_revision_identity: draft_id + revision
      approval_binding: draft_id + revision + content_hash
      approval_claim_rule: one approval -> one logical send
    send_reconciliation_contract:
      document: docs/V2-SEND-RECONCILIATION.md
      schema_migration: infrastructure/email/governance/migrations/002_send_reconciliation.sql
      offline_schema_test: infrastructure/email/governance/test_send_reconciliation.py
      provider_adapter: infrastructure/email/tencent-exmail/smtp_send_adapter.py
      provider_env_template: infrastructure/email/tencent-exmail/smtp.env.example
      provider_adapter_test: infrastructure/email/tencent-exmail/test_smtp_send_adapter.py
      normalized_outcomes:
        - SENT
        - CONFIRMED_NOT_SENT
        - OUTCOME_UNKNOWN
      ambiguous_outcome_behavior: RECONCILIATION_REQUIRED
      blind_retry_after_unknown: forbidden
      retry_identity: same logical_send_id + Message-ID + Date + transport_payload_hash
    recovery_clean_host_contract:
      document: docs/V2-RECOVERY-CLEAN-HOST.md
      governance_backup_helper: infrastructure/email/governance/backup_state.py
      governance_restore_helper: infrastructure/email/governance/restore_state.py
      offline_recovery_test: infrastructure/email/governance/test_recovery.py
      full_backup_helper: scripts/backup.sh
      isolated_restore_helper: scripts/restore.sh
      unresolved_attempt_after_restore: RECONCILIATION_REQUIRED
      installer_business_side_effects_on_rerun: forbidden
      v1_preservation_required: true
    acceptance:
      document: docs/acceptance/TENCENT-EXMAIL.md
      section: Tencent Enterprise Mail Integration Acceptance
    records:
      - provider
      - selected mailbox identifiers, never credentials
      - communication Profile/Assistant identifiers
      - Open WebUI employee identity method
      - logical group to Open WebUI runtime group mappings
      - mailbox grant summary
      - trusted forwarder authentication method/secret reference class, never secret value
      - IMAP/SMTP endpoint mode
      - governance state location and schema version
      - secret symbolic reference/storage class/location description, never value
      - deterministic provider adapter test result
      - deterministic governance schema/hash test result
      - deterministic send/reconciliation schema test result
      - deterministic Governance backup/restore/recovery test result
      - Stage 0–4 closure results
      - optional Stage 5/6 closure results when requested
      - positive and negative identity/mailbox authorization result
      - Draft revision/persistence result
      - deterministic human approval Action result
      - approval stale/revoke/single-claim result
      - stable logical send Message-ID and transport payload hash evidence
      - send attempt / normalized outcome evidence
      - reconciliation evidence/reference when applicable
      - Governance backup generation / isolated restore result when required
      - installer second-run convergence result
      - v2 rollback/degrade + v1 preservation result
      - read-only behavior result
      - approval-binding result
      - send/reconciliation result
      - acceptance result

  remote_access:
    kind: conditional
    enabled_when: capabilities.remote_access.enabled == true
    implementation:
      - infrastructure/access/README.md
    required_company_values:
      - access method
      - intended employee/admin surfaces
    acceptance:
      document: docs/ACCEPTANCE-TESTS.md
      section: Remote browser/private access
    records:
      - access method
      - exposed surfaces
      - admin restriction
      - TLS/identity boundary

  sso:
    kind: conditional
    enabled_when: capabilities.sso.enabled == true
    implementation:
      - infrastructure/access/README.md
      - infrastructure/access/OPEN-WEBUI-OIDC.md
    required_company_values:
      - identity provider
      - approved domains/groups/claims
      - client credentials or metadata
    acceptance:
      document: docs/ACCEPTANCE-TESTS.md
      section: Enterprise identity / SSO
    records:
      - identity provider
      - claim/group mapping
      - fallback/admin access policy
      - acceptance result

  employee_long_term_memory:
    kind: conditional
    enabled_when: capabilities.employee_long_term_memory.enabled == true
    implementation:
      - docs/CLIENT-RBAC.md
      - docs/PROFILE-STANDARD.md
      - infrastructure/hermes/features/EMPLOYEE-MEMORY.md
    acceptance:
      document: docs/ACCEPTANCE-TESTS.md
      sections:
        - Employee long-term memory
        - Cross-Profile memory
    records:
      - session/user scoping mechanism
      - enabled Profiles
      - cross-user isolation result
      - cross-Profile isolation result

production_controls:
  production.backup_restore:
    implementation:
      - docs/BACKUP-RESTORE.md
      - docs/V2-RECOVERY-CLEAN-HOST.md
      - scripts/backup.sh
      - scripts/restore.sh
      - infrastructure/email/governance/backup_state.py
      - infrastructure/email/governance/restore_state.py
    acceptance:
      document: docs/ACCEPTANCE-TESTS.md
      section: Backup and restore

  production.startup_recovery:
    implementation:
      - docs/OPERATIONS.md
      - docs/DEPLOYMENT.md
      - docs/V2-RECOVERY-CLEAN-HOST.md
    acceptance:
      document: docs/ACCEPTANCE-TESTS.md
      section: Startup/recovery

  production.security_access_review:
    implementation:
      - docs/SECURITY.md
      - docs/CLIENT-RBAC.md
    acceptance:
      document: docs/ACCEPTANCE-TESTS.md
      section: Production access/security review

  production.operations_health:
    implementation:
      - docs/OPERATIONS.md
      - scripts/health-check.sh
    acceptance:
      document: docs/ACCEPTANCE-TESTS.md
      section: Operations/health ownership
