# Enterprise AI Office — generic company configuration example
#
# This is the reusable PUBLIC desired-state schema/example. Real company-private
# values should normally live in a protected overlay such as `private/company.yaml`
# using `config/company.private.example.yaml` as the shape reference.
# Never commit production secrets here or in the private YAML overlay.

schema_version: 2

company:
  id: example-company
  name: Example Company
  display_name: Example Company
  primary_language: en
  additional_languages:
    - zh-CN
  timezone: Asia/Shanghai

deployment:
  environment: production # demo | staging | production
  target_readiness: production-ready # core-ready | configured-ready | production-ready
  host:
    type: mac-studio # examples: mac-studio, mac-mini, linux-server
    hostname: enterprise-ai-office
  runtime_root: /Users/Shared/enterprise-ai-office

knowledge:
  platform: weknora
  deployment: standard
  knowledge_bases:
    - id: company-general
      name: Company Knowledge
      description: Shared company information approved for employee use.
      allowed_groups:
        - all-employees
  data_classification:
    levels:
      - public
      - internal
      - confidential
      - restricted
  initial_ingestion_policy:
    allow:
      - public
      - internal
    require_review:
      - confidential
      - restricted

agent_runtime:
  platform: hermes-agent
  deployment: host-native
  privileged_default_profile_employee_exposed: false
  multi_profile_gateway:
    enabled: true
    explicit_allowlist: true

# `general` is the baseline employee-facing Profile. The Hermes default/admin
# Profile belongs to the control plane and is not listed as an employee Profile.
# Additional Profiles are enabled only when an actual capability/risk boundary
# requires them; v2 email uses a separate communication Profile when enabled.
profiles:
  - id: general
    display_name: General Assistant
    template: profiles/general/SOUL.md
    employee_groups:
      - all-employees
    knowledge_bases:
      - company-general
    capabilities:
      terminal: false
      code_execution: false
      coding_delegation: false
      web_search: false
    memory_policy: disabled-until-isolation-validated

employee_access:
  web:
    platform: open-webui
    groups:
      - id: all-employees
        display_name: All Employees
      - id: ai-admins
        display_name: AI Administrators
    default_permissions:
      chat: true
      history: true
      file_upload: true
      user_system_prompt_editing: false
      advanced_chat_parameters: false
    assistant_resources_private_by_default: true

# Optional capabilities are selected here. Disabled capabilities are not
# instantiated. Enabled capabilities must close implementation + acceptance
# before CONFIGURED READY.
capabilities:
  hermes_webui:
    enabled: false
    # exact_commit: <PIN_WHEN_ENABLED>
    access: loopback-only

  coding_delegation:
    enabled: false
    allowed_profiles: []
    backends:
      codex: false
      claude_code: false
    workspaces: []

  kanban:
    enabled: false
    orchestrator_profiles: []
    boards: []

  cron:
    enabled: false
    owner_profiles: []
    jobs: []

  messaging:
    enabled: false
    platform: null # feishu | wecom | weixin | another Hermes-supported platform
    authorization: allowlist-or-enterprise-identity
    allow_all_users: false
    routes: []

  # Email is a governed operational integration, not part of the core baseline.
  # Real mailbox/user/group values belong in the company-private overlay.
  email:
    enabled: false
    provider: null # currently documented provider playbook: tencent-exmail
    communication_profile: null
    mailboxes: []
    mailbox_grants: []
    controlled_test_recipients: []
    send_requires_human_approval: true
    attachments_enabled: false

  remote_access:
    enabled: false
    method: null # tailscale | cloudflare-access | vpn | approved-equivalent
    employee_surfaces:
      - open-webui
    admin_surfaces: []

  sso:
    enabled: false
    provider: null
    allowed_domains: []
    group_claim_mapping: {}

  employee_long_term_memory:
    enabled: false
    profiles: []

# v2 EAO-owned email governance persistence. Null paths are derived from
# deployment.runtime_root by the later installation contract when email is enabled.
email_governance:
  state_path: null
  technical_log_path: null
  retention_policy: company-defined

production:
  backup:
    enabled: true
    schedule: daily
    daily_retention: 14
    weekly_retention: 4
    require_off_primary_disk_copy: true
    off_primary_destination: <SELECT_PROTECTED_DESTINATION>
    restore_test_frequency: monthly
  startup_recovery:
    policy: documented-supported-recovery # automatic | documented-supported-recovery
  health:
    weekly_review: true
    operational_owner: <ASSIGN_OWNER>
  access_security_review:
    required: true

# Model IDs intentionally remain placeholders because providers/models evolve.
# Exact selected values and provider credentials belong in protected deployment
# configuration/runtime state, using the selected upstream's native fields.
models:
  hermes:
    provider: <SELECT_PROVIDER>
    default_model: <SELECT_MODEL>
  weknora:
    embedding_provider: <SELECT_PROVIDER>
    embedding_model: <SELECT_MODEL>
    embedding_dimension: <VERIFY_DIMENSION>
    rerank:
      enabled: false
      provider: null
      model: null

# Secret classes are references only. The deployment agent must resolve them to
# exact native secret variables/credential stores required by selected upstream
# providers/components. Real values never belong in desired-state YAML.
secrets:
  policy: external-protected-storage
  required_classes:
    - hermes-profile-api-keys
    - model-provider-credentials
    - weknora-runtime-secrets
    - open-webui-admin-credentials
  conditional_classes:
    - specialist-profile-credentials
    - hermes-webui-password
    - coding-agent-authentication
    - messaging-platform-credentials
    - email-mailbox-client-credentials
    - sso-client-credentials

# A private overlay may add symbolic secret refs with class/consumer/native-binding
# metadata. See config/company.private.example.yaml. Never put secret values here.
secret_refs: {}
