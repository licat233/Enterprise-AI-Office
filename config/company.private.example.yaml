# Enterprise AI Office — synthetic company-private overlay example
#
# This file documents the SHAPE of deployment-private, non-secret desired state.
# Real adopters should copy/adapt it into an ignored/protected location such as:
#
#   private/company.yaml
#
# Never put real secret values in this YAML. Secret references are symbolic only
# and are resolved from protected external storage at install/runtime.

schema_version: 2

company:
  id: example-company
  timezone: Asia/Tokyo

deployment:
  environment: staging
  runtime_root: /Users/Shared/enterprise-ai-office

# Core network routes are private, non-secret deployment desired state.
# These synthetic values demonstrate shape only.
core_network:
  weknora:
    api_base_url_for_hermes: http://127.0.0.1:18080/api/v1
    employee_exposed_directly: false

  hermes:
    shared_listener:
      bind_host: 0.0.0.0
      port: 8642
    open_webui_backend_base_url: http://host.docker.internal:8642
    employee_exposed_directly: false

  open_webui:
    employee_url: https://ai-office.example.invalid
    access_layer: private-network

# Core bootstrap identity is private company configuration, not a secret.
# Secret values are resolved by the symbolic refs below.
core_provisioning:
  weknora:
    owner_identity:
      email: knowledge-owner@example.invalid
      display_name: Example Knowledge Owner
      password_ref: weknora-owner-password
    intended_workspace_name: Example Company
    runtime_secret_refs:
      db_password: weknora-db-password
      redis_password: weknora-redis-password
      jwt_secret: weknora-jwt-secret

  hermes:
    default_api_key_ref: hermes-default-api-key
    profile_api_key_refs:
      general: hermes-general-api-key
      communication: communication-profile-api-key

  open_webui:
    admin_identity:
      email: ai-admin@example.invalid
      display_name: AI Administrator
      password_ref: openwebui-admin-password

# Private employee/group identifiers may live here because the public blueprint
# must not contain a real organization's employee directory.
employee_access:
  web:
    groups:
      - id: sales-team
        display_name: Sales Team

# Enable only the specialist Profile actually required by the selected capability.
# Each allowlist key must name a Profile that is actually declared below.
mcp_control_plane:
  registry: config/mcp-registry.yaml
  employee_exposure_default: disabled
  profile_allowlists:
    communication:
      - weknora

profiles:
  - id: communication
    display_name: Communication Assistant
    employee_groups:
      - sales-team
    knowledge_bases:
      - company-general
    memory_policy: disabled-until-isolation-validated

# Synthetic model-selection example. These are non-secret desired-state fields.
# The symbolic refs bind protected provider credentials to exact native inputs.
models:
  hermes:
    provider: openai-api
    default_model: <SELECT_MODEL>
    credential_refs:
      - hermes-model-provider-openai-key
  weknora:
    embedding_source: remote
    embedding_provider: openai
    embedding_model: <SELECT_MODEL>
    embedding_dimension: <VERIFY_DIMENSION>
    embedding_credential_ref: weknora-embedding-provider-openai-key
    rerank:
      enabled: false
      source: null
      provider: null
      model: null
      credential_ref: null

capabilities:
  enterprise_web_research:
    enabled: false
    allowed_profiles: []
    upstream: firecrawl
    credential_ref: null

  email:
    enabled: true
    provider: tencent-exmail
    communication_profile: communication
    send_requires_human_approval: true
    attachments_enabled: false

    # Mailbox identifiers/addresses are private company configuration, but they
    # are not credential values. Use stable logical mailbox IDs for policy links.
    mailboxes:
      - id: sales-mailbox
        address: sales@example.invalid
        business_purpose: customer-sales-communication
        read_folders:
          - INBOX
        provider:
          imap_host: imap.exmail.qq.com
          imap_port: 993
          smtp_host: smtp.exmail.qq.com
          smtp_port: 465
        client_credential_ref: email-sales-mailbox-client-password

    # Permissions are explicit per principal + mailbox. No matching grant = deny.
    mailbox_grants:
      - principal:
          type: group
          id: sales-team
        mailbox_id: sales-mailbox
        permissions:
          - email.read
          - email.draft
          - email.approve
          - email.send

    # Used only for controlled installation/acceptance when real deployment or
    # blueprint validation is explicitly authorized.
    controlled_test_recipients:
      - integration-test@example.invalid

email_governance:
  state_path: /Users/Shared/enterprise-ai-office/runtime/email-governance/state.sqlite3
  technical_log_path: /Users/Shared/enterprise-ai-office/logs/email-governance
  retention_policy: company-defined
  trusted_identity:
    source: open-webui
    actor_id_namespace: open-webui
    transport: server-authenticated-forwarder
    forwarder_credential_ref: openwebui-governance-forwarder-token
    user_id_header: X-EAO-Human-Actor-Id
    group_ids_header: X-EAO-Human-Group-Ids
    chat_id_header: X-EAO-Chat-Id
    message_id_header: X-EAO-Message-Id

# Symbolic references only. The values themselves belong in protected storage.
# No universal secret backend is assumed by this blueprint.
secret_refs:
  weknora-owner-password:
    class: weknora-owner-provisioning-credentials
    consumer: weknora-provisioning
    native_binding: WeKnora auth request password field

  weknora-db-password:
    class: weknora-runtime-secrets
    consumer: weknora-runtime+postgres
    native_binding: DB_PASSWORD

  weknora-redis-password:
    class: weknora-runtime-secrets
    consumer: weknora-runtime+redis
    native_binding: REDIS_PASSWORD

  weknora-jwt-secret:
    class: weknora-runtime-secrets
    consumer: weknora-app
    native_binding: JWT_SECRET

  hermes-default-api-key:
    class: hermes-profile-api-keys
    consumer: hermes-default-profile
    native_binding: API_SERVER_KEY

  hermes-general-api-key:
    class: hermes-profile-api-keys
    consumer: hermes-general-profile
    native_binding: API_SERVER_KEY

  hermes-model-provider-openai-key:
    class: model-provider-credentials
    consumer: hermes-model-provider
    native_binding: OPENAI_API_KEY

  weknora-embedding-provider-openai-key:
    class: model-provider-credentials
    consumer: weknora-model-provisioning
    native_binding: WeKnora /models parameters.api_key

  openwebui-admin-password:
    class: open-webui-admin-credentials
    consumer: open-webui-provisioning
    native_binding: OPEN_WEBUI_ADMIN_PASSWORD

  email-sales-mailbox-client-password:
    class: email-mailbox-client-credential
    consumer: eao-email-governance
    native_binding: EAIO_EMAIL_CLIENT_PASSWORD

  communication-profile-api-key:
    class: specialist-profile-credential
    consumer: hermes-communication-profile
    native_binding: API_SERVER_KEY

  openwebui-governance-forwarder-token:
    class: open-webui-governance-forwarder-credential
    consumer: open-webui-tool-connection+eao-email-governance
    native_binding: EAIO_TRUSTED_FORWARDER_TOKEN

# A real private overlay may also select non-secret model IDs, real
# employee/group identifiers, backup destinations, and similar deployment
# desired state. Core network routes should use the structured `core_network`
# block above rather than ad-hoc fields. Keep actual passwords/tokens/keys outside this file.
