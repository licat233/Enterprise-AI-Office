schema_version: 1
status: current-reference-baseline
first_validated_on: 2026-09-06
reference_runtime_last_confirmed_on: 2026-09-11
reference_runtime_confirmation_source: state/REAL-DEPLOYMENT-STATUS.md
qualification_semantics:
  first_validated_on: clean_reference_qualification_date
  reference_runtime_last_confirmed_on: same_versions_observed_in_current_reference_runtime
  does_not_claim_new_clean_host_validation: true
upgrade_policy: docs/UPGRADE.md
provenance_verified_on: 2026-09-11

target:
  host_os: macos
  architecture: arm64
  container_runtime: orbstack-docker

components:
  weknora:
    version: v0.8.0
    commit: 1edcd54b43606d9079bb36650efe3f68707a79ea
    upstream_repository: https://github.com/Tencent/WeKnora.git
    source_ref: v0.8.0
    source_ref_type: tag
    source_ref_matches_commit: true
    acquisition:
      method: git_clone_then_checkout_component_commit
      runtime_version_env:
        name: WEKNORA_VERSION
        value: "0.8.0"
    runtime_identity:
      source_commit_required: true
      container_name: WeKnora-app
      container_image: wechatopenai/weknora-app:0.8.0
    deployment: upstream-compose-plus-thin-adapter
  hermes_agent:
    version: 0.21.0
    commit: f1ccf436a27522c1bb5d36383a6f13b950676338
    upstream_repository: https://github.com/NousResearch/hermes-agent.git
    source_ref: commit
    source_ref_type: commit_only_no_version_tag
    version_source: pyproject.toml_at_component_commit
    acquisition:
      method: official_installer_from_component_commit
      installer_url_template: "https://raw.githubusercontent.com/NousResearch/hermes-agent/{commit}/scripts/install.sh"
      commit_flag: --commit
      eao_configuration_mode: install_runtime_then_apply_repository_managed_config
    runtime_identity:
      version_command: hermes --version
      expected_version: "0.21.0"
      source_commit_required: true
      source_dir_must_be_resolved_from_actual_install: true
    deployment: host-native
  open_webui:
    version: v0.11.3
    commit: 2a960a59fe1dbbd35282f0556b3666d81102e781
    upstream_repository: https://github.com/open-webui/open-webui.git
    source_ref: v0.11.3
    source_ref_type: tag
    source_ref_matches_commit: true
    acquisition:
      method: official_container_image_via_eao_compose
      image: ghcr.io/open-webui/open-webui:v0.11.3
      adapter: infrastructure/open-webui/docker-compose.yml
    runtime_identity:
      container_name: eaio-open-webui
      container_image: ghcr.io/open-webui/open-webui:v0.11.3
    deployment: docker-compose

baseline:
  control_plane_profile: default
  employee_profiles:
    - general
  employee_groups:
    - all-employees
    - ai-admins
  employee_long_term_memory: false
  open_webui:
    chat: true
    history: true
    file_upload: true
    user_system_prompt_editing: false
    advanced_chat_parameters: false

optional_capabilities:
  specialist_profiles: company-configured
  hermes_webui: disabled-unless-configured
  codex_delegation: disabled-unless-configured
  claude_code_delegation: disabled-unless-configured
  kanban: disabled-unless-configured
  cron: disabled-unless-configured
  messaging: disabled-unless-configured
  remote_access: disabled-unless-configured

notes:
  - This file is a reproducibility baseline, not a permanent version policy.
  - Do not silently replace these versions during an ordinary Golden Path deployment.
  - Upgrade qualification is a separate task governed by docs/UPGRADE.md.
  - Runtime secrets, model-provider values, company Knowledge Bases, and private access data do not belong in this file.
