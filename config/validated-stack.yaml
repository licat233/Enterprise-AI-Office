schema_version: 1
status: current-reference-baseline
first_validated_on: 2026-09-06
reference_runtime_last_confirmed_on: 2026-09-15
reference_runtime_confirmation_source: state/REAL-DEPLOYMENT-STATUS.md
qualification_semantics:
  first_validated_on: clean_reference_qualification_date
  reference_runtime_last_confirmed_on: current_reference_runtime_observation_date
  hermes_reference_runtime_is_not_permanent_pin: true
  does_not_claim_new_clean_host_validation: true
upgrade_policy: docs/UPGRADE.md
provenance_verified_on: 2026-09-15

target:
  host_os: macos
  architecture: arm64
  container_runtime: orbstack-docker
  host_qualification:
    exact_reference_family: apple_silicon_macos_with_orbstack_docker_compose
    docker_compatible_alternative_allowed: true
    alternative_inherits_reference_qualification: false
    revalidate_on_alternative:
      - host_docker_internal_reachability_from_open_webui
      - compose_and_volume_behavior
      - bind_mount_and_file_permissions
      - restart_and_startup_recovery

components:
  weknora:
    version: v0.8.0
    commit: 1edcd54b43606d9079bb36650efe3f68707a79ea
    upstream_repository: https://github.com/Tencent/WeKnora.git
    source_ref: v0.8.0
    source_ref_type: tag
    source_ref_matches_commit: true
    acquisition:
      method: git_clone_then_checkout_component_commit
      runtime_version_env:
        name: WEKNORA_VERSION
        value: "0.8.0"
    runtime_identity:
      source_commit_required: true
      container_name: WeKnora-app
      container_image: wechatopenai/weknora-app:0.8.0
    deployment: upstream-compose-plus-thin-adapter
  hermes_agent:
    version_policy: rolling-validated
    upstream_repository: https://github.com/NousResearch/hermes-agent.git
    tracking_ref: main
    reference_version: 0.21.2
    reference_tag: v2026.9.11
    reference_commit: 939e45c91d751fadd94dcd1b873ac3cb44846213
    reference_confirmed_on: 2026-09-15
    version_source: hermes_version_plus_git_identity
    update_policy:
      permanent_version_pin: false
      resolve_candidate_once_per_change: true
      automatic_unattended_update: false
      candidate_acceptance_required: true
      rollback_commit_required: true
    acquisition:
      method: official_installer_from_resolved_candidate_commit
      candidate_resolution: upstream_tracking_ref_at_transaction_start
      installer_url_template: "https://raw.githubusercontent.com/NousResearch/hermes-agent/{candidate_commit}/scripts/install.sh"
      commit_flag: --commit
      eao_configuration_mode: install_runtime_then_apply_repository_managed_config
      source_path_resolution:
        provenance: scripts/install.sh_at_candidate_commit
        explicit_env_override: HERMES_INSTALL_DIR
        explicit_flag_override: --dir
        non_root_default: "${HERMES_HOME:-$HOME/.hermes}/hermes-agent"
        root_linux_default: /usr/local/lib/hermes-agent
    runtime_identity:
      version_command: hermes --version
      exact_version_recording_required: true
      source_commit_required: true
      reference_match_required: false
      source_dir_must_be_resolved_from_actual_install: true
    deployment: host-native
  open_webui:
    version: v0.11.3
    commit: 2a960a59fe1dbbd35282f0556b3666d81102e781
    upstream_repository: https://github.com/open-webui/open-webui.git
    source_ref: v0.11.3
    source_ref_type: tag
    source_ref_matches_commit: true
    acquisition:
      method: official_container_image_via_eao_compose
      image: ghcr.io/open-webui/open-webui:v0.11.3
      adapter: infrastructure/open-webui/docker-compose.yml
    runtime_identity:
      container_name: eaio-open-webui
      container_image: ghcr.io/open-webui/open-webui:v0.11.3
    deployment: docker-compose

baseline:
  control_plane_profile: default
  employee_profiles:
    - general
  employee_groups:
    - all-employees
    - ai-admins
  employee_long_term_memory: false
  open_webui:
    chat: true
    history: true
    file_upload: true
    user_system_prompt_editing: false
    advanced_chat_parameters: false

optional_capabilities:
  specialist_profiles: company-configured
  hermes_webui: disabled-unless-configured
  codex_delegation: disabled-unless-configured
  claude_code_delegation: disabled-unless-configured
  kanban: disabled-unless-configured
  cron: disabled-unless-configured
  messaging: disabled-unless-configured
  remote_access: disabled-unless-configured
  eao_administrator_console: disabled-unless-configured

notes:
  - WeKnora and Open WebUI retain exact reference versions for the current Core baseline.
  - Hermes Agent uses a rolling-validated policy: no permanent version pin.
  - Each Hermes deployment/upgrade transaction resolves one upstream candidate commit, freezes that candidate for the transaction, records its exact runtime identity, runs acceptance, and retains a rollback commit.
  - Do not silently change a running Hermes deployment through unattended updates.
  - Hermes update qualification is governed by docs/UPGRADE.md.
  - Runtime secrets, model-provider values, company Knowledge Bases, and private access data do not belong in this file.
