name: Prune historical branches once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'licat233/Enterprise-AI-Office'
    runs-on: ubuntu-24.04
    steps:
      - name: Delete every remote branch except main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t branches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name'
          )

          deleted=0
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi

            echo "Deleting branch: $branch"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch"
            deleted=$((deleted + 1))
          done

          echo "Deleted $deleted non-main branches."
