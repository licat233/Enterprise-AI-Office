name: Repository Readiness

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-readiness:
    name: Agent reproducibility contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run repository readiness check
        env:
          EAO_REPOSITORY_ONLY: "1"
        run: sh scripts/repository-readiness-check.sh

      - name: Validate fresh-agent kit
        run: python3 scripts/validate-fresh-agent-kit.py

      - name: Check shell syntax
        run: |
          sh -n scripts/repository-readiness-check.sh
          bash -n scripts/backup.sh
          bash -n scripts/restore.sh
          sh -n scripts/run-public-offline-tests.sh

      - name: Check repository Markdown links
        run: python3 scripts/check-repository-links.py

      - name: Check declarative repository paths
        run: python3 scripts/check-declarative-paths.py

      - name: Check capability acceptance sections
        run: python3 scripts/check-capability-acceptance.py

      - name: Check public repository hygiene
        run: python3 scripts/check-public-repository-hygiene.py

      - name: Check frozen baseline history
        run: python3 scripts/check-frozen-baselines.py

      - name: Run public offline tests
        run: sh scripts/run-public-offline-tests.sh

      - name: Compile Python sources
        run: |
          python3 -m compileall -q scripts infrastructure skills
