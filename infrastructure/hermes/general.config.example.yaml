# Enterprise AI Office baseline Hermes `general` employee Profile
# Validated schema family: Hermes Agent 0.21.0 reference commit recorded in config/validated-stack.yaml.
# Copy/adapt into ~/.hermes/profiles/general/config.yaml.
# Secrets belong in the Profile's protected .env, not in this file.

model:
  default: "<SELECT_MODEL>"
  provider: "<SELECT_PROVIDER>"

memory:
  memory_enabled: false
  user_profile_enabled: false

# The OpenAI-compatible API surface for this employee Profile receives only the
# dynamic toolset generated by the WeKnora MCP server below.
platform_toolsets:
  api_server:
    - mcp-weknora

mcp_servers:
  weknora:
    command: uv
    args:
      - --directory
      - "<ABSOLUTE_WEKNORA_MCP_SERVER_DIRECTORY>"
      - run
      - run_server.py
    env:
      WEKNORA_API_KEY: "${WEKNORA_API_KEY}"
      WEKNORA_BASE_URL: "${WEKNORA_BASE_URL}"
    tools:
      include:
        - list_knowledge_bases
        - get_knowledge_base
        - hybrid_search
        - list_knowledge
        - get_knowledge
        - list_chunks
      resources: false
      prompts: false

# Add or change tools only when the company's actual General Assistant role
# requires them and the least-privilege boundary is revalidated.
