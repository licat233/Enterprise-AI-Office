schema_version: 2
project: Enterprise AI Office
repository_role: blueprint_repository
release_track: v2

# This repository designs two things:
# 1. what the Enterprise AI Office should be;
# 2. how a capable AI engineering agent should install and validate it.
#
# Developing the installation blueprint is still repository design work.
# It is NOT the same thing as deploying a real company instance.

blueprint_lifecycle:
  current_phase: release_ready
  phases:
    - system_design
    - installation_design
    - blueprint_validation
    - release_ready
  transition_requires_explicit_human_direction: true
  implicit_transition_allowed: false

  system_design:
    status: complete
    completion_milestone: SYSTEM DESIGN COMPLETE
    completed_on: 2026-09-06
    purpose: define what the Enterprise AI Office is and how its capabilities, authorities, workflows, security boundaries, and user experience should work
    allowed:
      - architecture and product design
      - capability scope and non-goals
      - threat modeling and authorization design
      - Ontology/schema design
      - provider and upstream research
      - sanitized examples and synthetic fixtures
      - design-support prototypes
      - offline tests and structural validation
      - acceptance criteria design
      - identify installation requirements that the later installation blueprint must satisfy
    closure_note: >-
      The v2 baseline System Design final review passed on 2026-09-06 and is frozen.
      Reopen it only for a genuine structural contradiction or blocker discovered
      during later blueprint work.

  installation_design:
    status: complete
    opened_on: 2026-09-06
    completed_on: 2026-09-07
    transition_ready: true
    purpose: turn the approved system design into an agent-readable and agent-executable installation and acceptance blueprint
    allowed:
      - deployment architecture design
      - installation sequencing
      - configuration schemas and templates
      - install/provision scripts and adapters
      - secret-input contracts without real secret values
      - idempotency and reconciliation design
      - rollback and recovery design
      - clean-host setup instructions
      - machine-readable capability closure
      - installation-time acceptance contracts
      - synthetic or isolated installation rehearsals
    completion_milestone: INSTALLATION DESIGN COMPLETE
    final_review: docs/V2-INSTALLATION-DESIGN-REVIEW.md
    final_review_result: PASS
    work_packages:
      id_1_installation_architecture:
        status: complete
        completed_on: 2026-09-06
        contract: docs/V2-INSTALLATION-ARCHITECTURE.md
        evidence: INSTALLATION ARCHITECTURE FROZEN
      id_2_config_protected_inputs:
        status: complete
        completed_on: 2026-09-06
        contract: docs/V2-CONFIG-PROTECTED-INPUTS.md
        example: config/company.private.example.yaml
        evidence: CONFIG / SECRET INPUT CONTRACT FROZEN
      id_3_stage_capability_closure:
        status: complete
        completed_on: 2026-09-06
        contract: docs/V2-STAGE-CONTRACTS.md
        evidence: STAGE CONTRACTS FROZEN
      id_4_identity_authorization_propagation:
        status: complete
        completed_on: 2026-09-06
        contract: docs/V2-IDENTITY-AUTHORIZATION-INSTALLATION.md
        provisioning: infrastructure/open-webui/V2-COMMUNICATION-PROVISIONING.md
        evidence: IDENTITY / AUTHORIZATION INSTALLATION CONTRACT FROZEN
      id_5_governance_runtime:
        status: complete
        completed_on: 2026-09-06
        contract: docs/V2-GOVERNANCE-RUNTIME.md
        sqlite_schema: infrastructure/email/governance/schema.sql
        offline_test: infrastructure/email/governance/test_schema.py
        approval_action: infrastructure/open-webui/v2_approve_draft_action.py
        evidence: GOVERNANCE RUNTIME CONTRACT FROZEN
      id_6_send_reconciliation:
        status: complete
        completed_on: 2026-09-07
        contract: docs/V2-SEND-RECONCILIATION.md
        schema_migration: infrastructure/email/governance/migrations/002_send_reconciliation.sql
        offline_schema_test: infrastructure/email/governance/test_send_reconciliation.py
        provider_adapter: infrastructure/email/tencent-exmail/smtp_send_adapter.py
        provider_adapter_test: infrastructure/email/tencent-exmail/test_smtp_send_adapter.py
        evidence: SEND / RECONCILIATION INSTALLATION CONTRACT FROZEN
      id_7_recovery_acceptance:
        status: complete
        completed_on: 2026-09-07
        contract: docs/V2-RECOVERY-CLEAN-HOST.md
        governance_backup_helper: infrastructure/email/governance/backup_state.py
        governance_restore_helper: infrastructure/email/governance/restore_state.py
        offline_recovery_test: infrastructure/email/governance/test_recovery.py
        full_backup_helper: scripts/backup.sh
        isolated_restore_helper: scripts/restore.sh
        evidence: RECOVERY / CLEAN-HOST INSTALLATION CONTRACT FROZEN
    closure_note: >-
      ID-1 through ID-7 are complete and the Installation Design final review passed on 2026-09-07.
      Blueprint Validation and Release Ready were later explicitly opened by human direction.
      Installation Design completion itself did not authorize those transitions or any new deployment target.
    note: installation_design does not authorize installation onto any real company system

  blueprint_validation:
    status: opened
    preparation_status: ready
    validation_entrypoint: VALIDATE.md
    fresh_agent_task: validation/FRESH-AGENT-TASK.md
    scorecard: validation/scorecard.yaml
    report_template: validation/REPORT.template.md
    static_check: scripts/validate-fresh-agent-kit.py
    purpose: prove that a fresh capable AI agent can understand the repository and reproduce the designed system on an explicitly approved clean validation target
    note: the phase is explicitly opened; validation targets still require explicit authorization and may be synthetic, isolated, or a designated test host; phase-open status does not imply validation PASS or production deployment

  release_ready:
    status: opened
    purpose: declare that the repository sufficiently explains both the system design and installation path for adoption
    note: the phase is explicitly opened; opened does not itself mean RELEASE READY has been declared or passed

continuation_language:
  does_not_change_blueprint_phase:
    - continue
    - keep going
    - start
    - begin
    - next
    - proceed
    - 继续
    - 开始
    - 开始吧
    - 下一步
    - 好的
  interpretation: continue valid work inside the current blueprint phase unless the human explicitly changes the blueprint phase

# A real deployment is a separate consumer activity, not the automatic next
# phase of repository development.
#
# IMPORTANT: this gate is the DEFAULT authorization state for a fresh clone or
# a new deployment target. It intentionally remains false even though the ARMOR
# reference implementation below is already separately authorized, deployed,
# active, and in use. Never interpret this field as the ARMOR runtime status.
real_deployment_task:
  active: false
  activation_requires_explicit_human_request: true
  requires_explicit_target: true
  must_not_be_inferred_from:
    - blueprint phase
    - system design completion
    - installation design activity
    - installation design completion
    - installation plan existence
    - install scripts existence
    - provider selection
    - prototype completion
    - offline test pass
    - acceptance plan existence
    - continuation language
  examples_of_explicit_activation_intent:
    - deploy this blueprint to the designated Mac Studio
    - begin the real ARMOR deployment on the approved host
    - 在指定的 Mac Studio 上开始真实部署
    - 现在开始在真实环境安装

reference_implementation:
  name: ARMOR
  exists: true
  independently_authorized: true
  sanitized_public_status: state/REAL-DEPLOYMENT-STATUS.md
  current_public_status_as_of: 2026-09-12
  note: >-
    The ARMOR reference implementation is already separately authorized, deployed,
    active, and in use. Its protected runtime details remain private and only a
    sanitized public status is published. This does not activate real_deployment_task
    for a fresh clone, authorize another deployment target, or advance the blueprint
    lifecycle. Deployment authorization is always target-specific.

public_repository_data_policy:
  real_credentials: prohibited
  real_personal_or_employee_identifiers: prohibited
  use_synthetic_identifiers_in_examples_and_tests: true

interpretation_rules:
  - The repository is a system-design and installation-blueprint product, not a live deployment record.
  - The v2 baseline System Design milestone is complete and frozen.
  - The v2 baseline Installation Design milestone is complete and transition-ready.
  - Blueprint Validation has been explicitly opened.
  - Release Ready has also been explicitly opened; phase-open status does not itself mean either validation PASS or RELEASE READY declaration.
  - Installation design means designing how an AI agent will install the system; it does not mean performing a real installation.
  - A real deployment task requires an explicit target and explicit human request independently of blueprint phase.
  - Prototype code, tests, playbooks, adapters, and installation plans are repository artifacts, not evidence that a company instance is being deployed.
  - Missing real credentials are never blockers for blueprint development because credentials belong to a real deployment or explicitly approved validation task.

last_reviewed: 2026-09-11
