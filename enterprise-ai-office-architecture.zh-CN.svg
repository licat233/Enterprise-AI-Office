<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise AI Office v2 中文架构图</title>
  <desc id="desc">展示通用助手、沟通助手、WeKnora、Hermes、EAO 邮件治理服务、邮件服务商、治理 SQLite 与当前项目生命周期状态的高层架构图。</desc>
  <defs>
    <style><![CDATA[
      .bg { fill: #f7fafc; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, Arial, sans-serif; fill: #334155; }
      .section { font: 700 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, Arial, sans-serif; fill: #334155; }
      .tiny { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, Arial, sans-serif; fill: #475569; }
      .chip { font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, Arial, sans-serif; fill: #0f172a; }
      .box { stroke: #cbd5e1; stroke-width: 2; rx: 16; ry: 16; }
      .box-dark { stroke: #94a3b8; stroke-width: 2; rx: 16; ry: 16; }
      .shadow { filter: drop-shadow(0 6px 12px rgba(15,23,42,0.08)); }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .arrow-soft { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrowheadSoft); }
      .dashed { stroke-dasharray: 10 8; }
    ]]></style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#475569" />
    </marker>
    <marker id="arrowheadSoft" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>

  <text class="title" x="60" y="70">Enterprise AI Office — v2 系统架构蓝图</text>
  <text class="subtitle" x="60" y="105">当前状态：系统设计已完成 · 安装设计已完成 · 蓝图验证尚未开启</text>

  <rect x="1060" y="42" width="160" height="34" rx="17" fill="#dcfce7" stroke="#86efac"/>
  <text class="chip" x="1080" y="64">系统设计 ✓</text>
  <rect x="1235" y="42" width="190" height="34" rx="17" fill="#dcfce7" stroke="#86efac"/>
  <text class="chip" x="1258" y="64">安装设计 ✓</text>
  <rect x="1060" y="84" width="365" height="34" rx="17" fill="#fef3c7" stroke="#fcd34d"/>
  <text class="chip" x="1080" y="106">真实部署未激活 · 蓝图验证待开启</text>

  <g class="shadow">
    <rect class="box-dark" x="60" y="180" width="200" height="100" fill="#e2e8f0"/>
    <text class="label" x="90" y="220">HumanActor</text>
    <text class="small" x="90" y="248">已认证员工</text>
  </g>

  <g class="shadow">
    <rect class="box" x="320" y="140" width="390" height="230" fill="#ffffff"/>
    <text class="section" x="350" y="178">Open WebUI</text>
    <text class="small" x="350" y="205">员工主入口 · 可信身份来源</text>

    <rect class="box" x="350" y="230" width="150" height="105" fill="#eff6ff"/>
    <text class="label" x="375" y="268">通用</text>
    <text class="small" x="375" y="292">助手</text>
    <text class="tiny" x="370" y="318">不含邮件工具</text>

    <rect class="box" x="525" y="230" width="155" height="105" fill="#f0fdf4"/>
    <text class="label" x="545" y="268">沟通</text>
    <text class="small" x="575" y="292">助手</text>
    <text class="tiny" x="545" y="318">邮件审核 + 审批界面</text>
  </g>

  <g class="shadow">
    <rect class="box" x="780" y="110" width="330" height="290" fill="#ffffff"/>
    <text class="section" x="810" y="148">Hermes</text>
    <text class="small" x="810" y="175">按 Profile 进行推理与编排</text>

    <rect class="box" x="810" y="210" width="125" height="120" fill="#eff6ff"/>
    <text class="label" x="836" y="248">general</text>
    <text class="small" x="842" y="274">Profile</text>
    <text class="tiny" x="827" y="300">仅检索</text>

    <rect class="box" x="955" y="210" width="125" height="120" fill="#f0fdf4"/>
    <text class="label" x="969" y="248">communication</text>
    <text class="small" x="988" y="274">Profile</text>
    <text class="tiny" x="970" y="300">起草辅助</text>
  </g>

  <g class="shadow">
    <rect class="box" x="1180" y="160" width="280" height="110" fill="#ffffff"/>
    <text class="section" x="1210" y="198">WeKnora</text>
    <text class="small" x="1210" y="226">企业知识权威来源</text>
    <text class="tiny" x="1210" y="248">检索 · 策略 · 产品/公司上下文</text>
  </g>

  <g class="shadow">
    <rect class="box" x="320" y="470" width="1180" height="370" fill="#ffffff"/>
    <text class="section" x="350" y="510">受治理的沟通路径</text>
    <text class="small" x="350" y="537">确定性的草稿 / 审批 / 发送闭环，与 v1 通用路径隔离</text>

    <rect class="box" x="390" y="590" width="370" height="150" fill="#f8fafc"/>
    <text class="label" x="420" y="630">EAO 邮件治理服务</text>
    <text class="tiny" x="420" y="660">邮箱范围授权</text>
    <text class="tiny" x="420" y="685">DraftReply 版本 · SendApproval</text>
    <text class="tiny" x="420" y="710">审批占用 · 审计 · 对账</text>

    <rect class="box" x="820" y="590" width="250" height="150" fill="#f8fafc"/>
    <text class="label" x="850" y="630">治理 SQLite</text>
    <text class="tiny" x="850" y="660">草稿 · 审批</text>
    <text class="tiny" x="850" y="685">逻辑发送 · 尝试</text>
    <text class="tiny" x="850" y="710">对账证据</text>

    <rect class="box" x="1130" y="590" width="300" height="150" fill="#f8fafc"/>
    <text class="label" x="1160" y="630">邮件服务商</text>
    <text class="small" x="1160" y="656">腾讯企业邮（参考 Provider）</text>
    <text class="tiny" x="1160" y="685">IMAP 只读适配器</text>
    <text class="tiny" x="1160" y="710">SMTP 发送适配器</text>

    <rect class="box" x="390" y="760" width="1040" height="54" fill="#fff7ed"/>
    <text class="small" x="420" y="794">备份 / 恢复 / 故障恢复 / 干净主机验证：治理快照、恢复安全、分级回滚、阶段验收、安装器重复执行收敛</text>
  </g>

  <path class="arrow" d="M260 230 H320"/>
  <path class="arrow" d="M500 282 H780"/>
  <path class="arrow" d="M680 282 H780"/>
  <path class="arrow" d="M1110 225 H1180"/>
  <path class="arrow-soft dashed" d="M575 335 V430"/>
  <path class="arrow-soft" d="M602 430 V590"/>
  <text class="tiny" x="620" y="480">服务端邮件工具 + 审批 Action</text>
  <path class="arrow" d="M760 665 H820"/>
  <path class="arrow" d="M1070 665 H1130"/>
  <text class="tiny" x="350" y="408">Open WebUI 向治理服务传递可信 HumanActor 上下文</text>

  <g class="shadow">
    <rect class="box" x="60" y="330" width="200" height="135" fill="#ffffff"/>
    <text class="label" x="85" y="368">关键规则</text>
    <text class="tiny" x="85" y="396">• 自然语言 ≠ 正式审批</text>
    <text class="tiny" x="85" y="420">• 通用路径保持独立</text>
    <text class="tiny" x="85" y="444">• 发送结果不明 ⇒ 对账</text>
  </g>

  <g class="shadow">
    <rect class="box" x="1180" y="300" width="280" height="120" fill="#ffffff"/>
    <text class="label" x="1210" y="338">当前进度</text>
    <text class="tiny" x="1210" y="366">• ID-1 ～ ID-7 已完成</text>
    <text class="tiny" x="1210" y="390">• 蓝图验证尚未开启</text>
    <text class="tiny" x="1210" y="414">• 真实部署仍未激活</text>
  </g>

  <text class="tiny" x="60" y="925">本图表示 System Design 与 Installation Design 完成后的仓库蓝图架构。</text>
  <text class="tiny" x="60" y="947">它不代表真实生产环境已经完成部署。</text>
</svg>
